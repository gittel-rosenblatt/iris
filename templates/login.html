<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</head>
<body>
    
<header>
    <div class="header-left">
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='images/iris-circle-icon.png') }}" alt="iris logo">
        </a>
        <h1>Iris: Lighting up the digital world</h1>
    </div>

    <nav class="header-nav">
        <a href="{{ url_for('story') }}" class="nav-link">Our Story</a>
        <a href="{{ url_for('login') }}" class="login-link">Log in</a>
    </nav>
</header>

<main id="login-main">
    <div class="login-container">
        <section class="login">
            <h2>Welcome back &lt;3</h2>
            <p>Login here. Please enter your details.</p>
            <form class="form" action="/login-endpoint" method="POST">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    autocomplete="username"
                    placeholder="Enter your username" 
                    required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    autocomplete="current-password"
                    placeholder="Enter your password" 
                    required
                    >
                    <button type="button" id="toggle-password">Show</button>
                </div>

                <a href="{{ url_for('forgot_password') }}" id="forgot-password">Forgot password? Reset it here.</a>

                <button type="submit">Sign in</button>
            </form>
            <p class="toggle-text">
                Don't have an account? 
                <button type="button" id="switch-to-signup" class="link-btn">Sign up here</button>
            </p>
        </section>

        <section class="login-image">
            <img src="{{ url_for('static', filename='images/iris-flower.jpg') }}" alt="Image of iris flowers">
        </section>
    </div>
</main>

<footer>
    <div class="contact-info">
        <a href="mailto:iris@gmail.com"><img src="{{ url_for('static', filename='images/gmail-logo.png') }}" alt="email logo">iris@gmail.com</a>
        <a href="tel:+11234567890"><img src="{{ url_for('static', filename='images/phone-icon.png') }}" alt="phone logo">+1 (###) ###-###</a>
        <a href="#"><img src="{{ url_for('static', filename='images/insta-logo.png') }}" alt="instagram logo">@instagram-handle</a>
        <a href="{{ url_for('story') }}"><img src="{{ url_for('static', filename='images/story-icon.png') }}" alt="book image">Our Story</a>
    </div>

    <div class="copyright-legal">
        <p>&copy; 2026 Iris. All Rights Reserved.</p>
        <a href="{{ url_for('terms') }}">Terms of Service</a>
        <a href="{{ url_for('privacy') }}">Privacy Policy</a>
    </div>
</footer>
</body>
</html>
