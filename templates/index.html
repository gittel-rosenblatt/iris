<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - Home</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #FAFAFA; /* Soft, clean off-white */
            color: #1A1A1A;            /* Deep, high-contrast dark charcoal text */
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        .logo-placeholder {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 70px;
            color: #2C3E50; /* A soft, deep slate blue for headings */
            margin-bottom: 10px;
        }
        p {
            font-size: 35px;
            line-height: 1.6;
            color: #4A4A4A;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            background-color: #E3F2FD; /* Example soft, light logo color (pastel blue) */
            color: #0D47A1;            /* Deep, dark blue text inside button for high contrast */
            font-size: 40px;
            font-weight: bold;
            padding: 25px 60px;
            border: 3px solid #0D47A1; /* Sharp, high-contrast border */
            border-radius: 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder">⭕</div>
        <h1>Welcome to Iris</h1>
        <p>A simple, accessible form assistant designed to make paperwork stress-free.</p>
        <a href="#" class="btn">Get Started</a>
    </div>
</body>
</html>
