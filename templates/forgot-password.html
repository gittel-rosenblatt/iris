<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot-password.css') }}"> 
    <script src="{{ url_for('static', filename='js/global.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</head>
<body>
    
<header>
    <div class="header-left">
        <a href="{{ url_for('home') }}">
            <img class="iris-logo" src="{{ url_for('static', filename='images/iris-circle-icon.png') }}" alt="iris logo">
        </a>
        <h1 class="header-name">
            <span class="brand-name">Iris</span>
            <span class="divider" aria-hidden="true">|</span>
            <span class="header-tagline">Lighting up the digital world</span>
        </h1>
    </div>

    <nav class="header-nav">
        <button aria-hidden="true"type="button" class="btn-tts">Listen 🔊</button>
        <a href="{{ url_for('story') }}">
            <span class="long-text">Our story</span>
            <span class="short-text" aria-hidden="true">Story</span>
        </a>
        <a href="{{ url_for('login') }}">Login</a>
    </nav>
</header>

<main id="forgot-password-main">
    <section class="auth-container">
        <h2>Forgot Password?</h2>
        <p class="subtitle">Enter your username to find your account.</p>

        <form class="form" action="/check-username" method="POST">
            <div class="form-group">
                <label for="reset-username">Username:</label>
                <input 
                    type="text" 
                    id="reset-username" 
                    name="username" 
                    placeholder="Enter your username" 
                    required
                >
            </div>

            <button type="submit">Next</button>
        </form>

        <div class="auth-links">
            <a class="back-to-login" href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </section>
</main>

<footer>
    <div>
        <a id="back-to-top" href="#">↑</a>
    </div> 

    <div class="footer-text">
        <div class="copyright">
            <p style="margin: 0;">&copy; 2026 Iris. All Rights Reserved.</p>
        </div>

        <nav class="footer-nav">
            <a href="{{ url_for('terms') }}">
                <span class="long-text">Terms of Service</span>
                <span class="short-text" aria-hidden="true">Terms</span>
            </a>
            <a href="{{ url_for('privacy') }}">
                <span class="long-text">Privacy Policy</span>
                <span class="short-text" aria-hidden="true">Privacy</span>
            </a>
            <a href="{{ url_for('contact') }}">
                <span class="long-text">Contact us & FAQs</span>
                <span class="short-text" aria-hidden="true">Contact</span>
            </a>
            <a href="{{ url_for('story') }}">
                <span class="long-text">Our story</span>
                <span class="short-text" aria-hidden="true">Story</span>  
            </a>
        </nav>
    </div>
</footer>

</body>
</html>
